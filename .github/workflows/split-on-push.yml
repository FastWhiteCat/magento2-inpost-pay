name: Split on Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: packages/magento2-module-restrictions
            split_repo: magento2-module-restrictions
          - local_path: packages/magento2-module-inpost-pay
            split_repo: magento2-module-inpost-pay
          - local_path: packages/magento2-module-inpost-pay-graph-ql
            split_repo: magento2-module-inpost-pay-graph-ql
          - local_path: packages/magento2-module-inpost-pay-commerce
            split_repo: magento2-module-inpost-pay-commerce
          - local_path: packages/magento2-module-restrictions-commerce
            split_repo: magento2-module-restrictions-commerce
          - local_path: packages/magento2-module-inpost-pay-hyva-checkout
            split_repo: magento2-module-inpost-pay-hyva-checkout
          - local_path: packages/magento2-module-inpost-pay-hyva-theme
            split_repo: magento2-module-inpost-pay-hyva-theme
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SPLIT_APP_ID: op://project-inpostpay/inpostpay--github-app/App ID
          SPLIT_APP_PRIVATE_KEY: op://project-inpostpay/inpostpay--github-app/inpost-pay-management.2026-03-24.private-key.pem

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ env.SPLIT_APP_ID }}
          private-key: ${{ env.SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install splitsh-lite
        run: |
          go install github.com/splitsh/lite@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Split ${{ matrix.package.split_repo }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHA=$(lite --prefix=${{ matrix.package.local_path }})
          git remote add split "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/${{ matrix.package.split_repo }}.git"
          git push split "${SHA}:refs/heads/main" --force
